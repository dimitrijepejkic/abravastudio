<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Unsubscribed | ABRAVA STUDIO</title>

    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #050816;
            font-family: 'Press Start 2P', cursive;
            color: white;
            text-align: center;
        }

        .card-box {
            width: min(90%, 700px);
            padding: 50px 30px;
            border: 2px solid #baf670;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(8px);
            box-shadow:
                0 0 25px rgba(186, 246, 112, .3),
                inset 0 0 15px rgba(255, 255, 255, .04);
        }

        h1 {
            font-size: clamp(1.5rem, 4vw, 2.8rem);
            margin-bottom: 40px;
        }

        .a-green {
            color: #baf670;
        }

        .brava {
            color: white;
        }

        .studio {
            color: #baf670;
        }

        p {
            font-size: clamp(.7rem, 1.6vw, .9rem);
            line-height: 2;
            color: #d6d6d6;
            margin-bottom: 40px;
        }

        .btn-return {
            border: 2px solid #baf670;
            color: #baf670;
            padding: 14px 28px;
            text-decoration: none;
            transition: .25s;
            display: inline-block;
        }

        .btn-return:hover {
            background: #baf670;
            color: #050816;
            box-shadow: 0 0 20px #baf670;
        }
    </style>
</head>

<body>

    <div class="card-box">

        <h1>
            <span class="a-green">A</span><span class="brava">BRAVA</span>
            <span class="studio"> STUDIO</span>
        </h1>

        <p>
            You have successfully unsubscribed
            from our newsletter.
            <br><br>
            We're sorry to see you go.
            <br><br>
            If this was a mistake, you can
            subscribe again anytime.
        </p>

        <a href="index.html" class="btn-return">
            RETURN TO WEBSITE
        </a>

    </div>

</body>

</html>
