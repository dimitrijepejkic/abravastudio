# Only facts visible in the listing, its screenshots, or the studio's own copy belong here.
name: Leap UP!
storeTitle: 'Leap UP: Endless Runner'
status: available
featured: true
order: 1

genre:
  en: Endless jumper
  sr: Igra beskrajnog skakanja

# Official short description from the store listing.
tagline:
  en: Totally normal day… probably.
  sr: Sasvim običan dan… valjda.

summary:
  en: Escape the sewer, bounce through NYC, and keep going higher than expected.
  sr: Pobegni iz kanalizacije, skakući kroz Njujork i penji se više nego što si očekivao.

description:
  en:
    - Leap UP! is an endless vertical jumper. Tilt your phone to steer, bounce from platform to platform and see how high you can climb.
    - Start deep in the sewer, burst out onto the streets of New York and keep going, past the rooftops, through the clouds and out into space. Collect coins along the way and spend them in the shop on new skins.
  sr:
    - Leap UP! je igra beskrajnog skakanja nagore. Nagni telefon da usmeriš skok, skači s platforme na platformu i proveri koliko visoko možeš da stigneš.
    - Kreni iz dubine kanalizacije, izleti na ulice Njujorka i nastavi dalje, preko krovova i kroz oblake, sve do svemira. Usput skupljaj novčiće i troši ih u prodavnici na nove izglede lika.

features:
  - title: { en: Tilt to steer, sr: Nagni i upravljaj }
    text:
      en: Tilt your phone left and right to guide every jump.
      sr: Naginji telefon levo i desno i usmeravaj svaki skok.
  - title: { en: Endless climb, sr: Penjanje bez kraja }
    text:
      en: There’s no finish line. Chase your best score and go again.
      sr: Nema cilja. Juri svoj najbolji rezultat i pokušaj ponovo.
  - title: { en: Sewer to space, sr: Od kanalizacije do svemira }
    text:
      en: Climb through the sewer, New York City, the clouds and space.
      sr: Penji se kroz kanalizaciju, Njujork, oblake i svemir.
  - title: { en: Coins & skins, sr: Novčići i izgledi }
    text:
      en: Grab coins on the way up and unlock new skins in the shop.
      sr: Skupljaj novčiće usput i otključavaj nove izglede lika u prodavnici.

