# Leap UP: Pixel Jump Game — verified against the live Google Play listing (com.leapup, version 1.1.0,
# updated 2026-10-26) on 2026-10-29. Only facts visible in the listing, its screenshots, or the studio's own
# copy belong here.
# The full title is the official name (studio decision, 2026-10-29); running text uses the short "Leap UP",
# as the store description does.
name: 'Leap UP: Pixel Jump Game'
status: available
featured: true
order: 1

genre:
  en: Endless jumper
  sr: Igra beskrajnog skakanja

# Opening line of the store description.
tagline:
  en: Totally normal day… probably.
  sr: Sasvim običan dan… valjda.

# Official short description from the store listing.
summary:
  en: 'Pixel-art jumper: tilt to escape the sewer, bounce through NYC, jump higher!'
  sr: 'Piksel-art skakanje: nagni telefon, pobegni iz kanalizacije, skakući kroz Njujork i skoči više!'

description:
  en:
    - Leap UP is a pixel-art endless jumper. Tilt your phone to steer, bounce from platform to platform and see how high you can climb. It’s easy to pick up, hard to put down and perfect for a few spare minutes.
    - It starts as a totally normal day. Then you fall into the sewer, and the only way out is up, through the streets of New York City, past clouds and rockets, through a black hole and all the way to heaven. The screen keeps climbing and won’t wait for you, and one miss ends the run.
    - Power-ups help on the way. A jetpack smashes up through platforms, a parachute lets you float down slowly and a magnet pulls in every coin nearby. Spend your coins in the shop on new skins, and watch for the green flag that marks your record height.
  sr:
    - Leap UP je piksel-art igra beskrajnog skakanja nagore. Naginji telefon da upravljaš, skači s platforme na platformu i proveri koliko visoko možeš da stigneš. Lako se uči, teško se ostavlja i savršena je za par slobodnih minuta.
    - Sve počinje kao sasvim običan dan. A onda upadneš u kanalizaciju, i jedini izlaz je nagore, kroz ulice Njujorka, pored oblaka i raketa, kroz crnu rupu i sve do raja. Ekran se sam penje i ne čeka te, a jedan promašaj znači kraj partije.
    - Usput ti pomažu pojačanja. Mlazni ranac probija platforme na putu nagore, padobran te polako spušta, a magnet privlači sve novčiće u blizini. Novčiće troši u prodavnici na nove izglede lika i prati zelenu zastavicu koja označava visinu tvog rekorda.

features:
  - title: { en: Tilt to steer, sr: Nagni i upravljaj }
    text:
      en: Tilt your phone left and right to guide every jump. Land on a platform and you bounce up on your own.
      sr: Naginji telefon levo i desno i usmeravaj svaki skok. Kad se dočekaš na platformu, sam odskačeš nagore.
  - title: { en: Sewer to heaven, sr: Od kanalizacije do raja }
    text:
      en: 'Six worlds, one climb: the sewer, New York City, the sky, a sky full of rockets, a black hole and heaven.'
      sr: 'Šest svetova, jedno penjanje: kanalizacija, Njujork, nebo, nebo puno raketa, crna rupa i raj.'
  - title: { en: Power-ups, sr: Pojačanja }
    text:
      en: A jetpack to smash upward, a parachute to float down slowly and a magnet that pulls in every coin nearby.
      sr: Mlazni ranac za proboj nagore, padobran za lagano spuštanje i magnet koji privlači sve novčiće u blizini.
  - title: { en: Beat your record, sr: Obori rekord }
    text:
      en: There’s no finish line. A green flag marks your best height, so you always know when you beat it.
      sr: Cilja nema. Zelena zastavica stoji na visini tvog rekorda, pa tačno vidiš kada ga obaraš.
  - title: { en: Coins & skins, sr: Novčići i izgledi }
    text:
      en: Grab coins on the way up, including rare turquoise ones, and unlock animated skins in the shop.
      sr: Skupljaj novčiće usput, među njima i retke tirkizne, i otključavaj animirane izglede lika u prodavnici.
  - title: { en: Fair play, sr: Fer igra }
    text:
      en: 'No forced video ads: you only watch one if you choose to. Plays offline, no Wi-Fi needed.'
      sr: 'Bez prisilnih video reklama: gledaš ih samo ako želiš. Igra radi i bez interneta.'

platforms:
  android:
    status: available
    url: https://play.google.com/store/apps/details?id=com.leapup

