keyArtAlt:
  en: 'The Leap UP hero, a red pixel-art character in a blue cap, wearing a jetpack in a starry night sky next to the title “Leap UP: Pixel Jump Game”.'
  sr: 'Junak igre Leap UP, crveni piksel-art lik sa plavim kačketom i mlaznim rancem, na zvezdanom nebu pored natpisa „Leap UP: Pixel Jump Game”.'

# The store screenshots, in store order. Their captions are part of the image, in English.
screenshots:
  - src: ../../assets/games/leap-up/screenshots/01-tilt-jump-climb.png
    alt:
      en: Caption “Tilt. Jump. Climb!”, with the hero bouncing between cloud platforms in the night sky.
      sr: Natpis „Nagni. Skoči. Penji se!”, a junak skakuće po oblacima na noćnom nebu.
  - src: ../../assets/games/leap-up/screenshots/02-jetpack.png
    alt:
      en: Caption “Smash up with a jetpack!”, with the hero flying up on a jetpack and breaking through a cloud platform.
      sr: Natpis „Probij se mlaznim rancem!”, a junak leti nagore s mlaznim rancem i razbija oblak.
  - src: ../../assets/games/leap-up/screenshots/03-beat-your-record.png
    alt:
      en: Caption “Beat your record!”, with a green flag marking the record height among rockets in the night sky.
      sr: Natpis „Obori svoj rekord!”, a zelena zastavica označava visinu rekorda među raketama na noćnom nebu.
  - src: ../../assets/games/leap-up/screenshots/04-grab-every-coin.png
    alt:
      en: Caption “Grab every coin”, with the magnet power-up pulling nearby coins toward the hero.
      sr: Natpis „Pokupi svaki novčić”, a magnet privlači obližnje novčiće ka junaku.
  - src: ../../assets/games/leap-up/screenshots/05-sewer-to-heaven.png
    featured: true
    alt:
      en: Caption “From the sewer to heaven”, over four worlds side by side, the sewer, a New York skyscraper, a black hole and the gates of heaven.
      sr: Natpis „Od kanalizacije do raja”, iznad četiri sveta jedan pored drugog, kanalizacije, njujorškog nebodera, crne rupe i rajske kapije.
  - src: ../../assets/games/leap-up/screenshots/06-shop.png
    alt:
      en: Caption “Unlock 4 skins”, with the shop offering the Ninja skin for 2,500 coins.
      sr: Natpis „Otključaj 4 izgleda”, a prodavnica nudi nindža izgled za 2.500 novčića.
  - src: ../../assets/games/leap-up/screenshots/07-how-high.png
    alt:
      en: Caption “How high can you go?”, with the hero climbing past rockets that fly sideways.
      sr: Natpis „Koliko visoko možeš?”, a junak se penje pored raketa koje lete bočno.
  - src: ../../assets/games/leap-up/screenshots/08-one-more-try.png
    alt:
      en: Caption “One more try?”, over the Game Over screen with a new best score of 1040, 1104 coins earned and a Reset button.
      sr: Natpis „Još jedan pokušaj?”, iznad ekrana za kraj igre sa novim najboljim rezultatom 1040, 1104 osvojena novčića i dugmetom Reset.

